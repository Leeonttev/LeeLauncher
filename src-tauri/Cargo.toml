[package]
name = "leelauncher"
version = "0.1.2"
description = "LeeLauncher — лаунчер Minecraft"
authors = ["leeonttev"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с бинарником на Windows (cargo#8519).
name = "leelauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
log = "0.4.35"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
url = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "fs", "process", "io-util", "rt"] }
tokio-util = "0.7"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "multipart"] }
tauri-plugin-log = "2"
sha1 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
notify = { version = "8", default-features = false }
semver = "1"
# Статус в Discord через локальный IPC (без сети и SDK).
discord-rich-presence = "1.1"
# База Modrinth App (импорт сборок) — SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net"] }
