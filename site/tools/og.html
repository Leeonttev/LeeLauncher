<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../public/assets/style.css" />
		<style>
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #18181b;
				color: #f5f5f7;
			}
			.og {
				position: relative;
				height: 100%;
				padding: 72px 80px;
			}
			.og img.logo {
				height: 34px;
				display: block;
			}
			.og h1 {
				margin: 56px 0 0;
				font-size: 64px;
				line-height: 1.04;
				letter-spacing: -0.03em;
				font-weight: 600;
			}
			.og p {
				margin: 24px 0 0;
				font-size: 26px;
				color: #a1a1a6;
				letter-spacing: -0.016em;
			}
			.og .shot {
				position: absolute;
				left: 680px;
				top: 180px;
				width: 720px;
				padding: 20px;
				border-radius: 32px;
				background: #222225;
			}
			.og .shot img {
				display: block;
				width: 100%;
				border-radius: 10px;
			}
		</style>
	</head>
	<body>
		<div class="og">
			<img class="logo" src="../public/assets/img/logo-dark.svg" alt="" />
			<h1>Свои сборки.<br />В пару щелчков.</h1>
			<p>Лаунчер Minecraft с открытым кодом</p>
			<div class="shot"><img src="../public/assets/img/home-dark-1600.webp" alt="" /></div>
		</div>
	</body>
</html>
