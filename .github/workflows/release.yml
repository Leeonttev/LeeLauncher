# Выпуск версии: тег `vX.Y.Z` (совпадает с `version` в src-tauri/Cargo.toml) → сборка для Windows
# (свой установщик с лаунчером внутри) и macOS (универсальный .app в .dmg, без подписи Apple),
# подпись minisign пакетов обновления и черновик релиза с `latest.json` на все платформы.
# Подпись Windows лежит только в `latest.json`; `.sig` macOS выкладывается рядом с архивом.
# Лаунчеры видят версию только после того, как черновик опубликуют вручную.
name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Версия в Cargo.toml совпадает с тегом
              shell: bash
              run: |
                  version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Тег $GITHUB_REF_NAME, а в src-tauri/Cargo.toml версия $version"
                    exit 1
                  fi

            # Текст «Что нового» — раздел `## X.Y.Z` из CHANGELOG.md. notes.md идёт в `notes` файла
            # latest.json (экран обновления), release-body.md — тело релиза: сверху ссылки на
            # установщики, ниже тот же текст. Нет раздела — нет релиза.
            - name: Что нового из CHANGELOG.md
              shell: bash
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  awk -v head="## $version" '
                    $0 == head { found = 1; next }
                    found && /^## / { exit }
                    found { print }
                  ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
                  if ! grep -q '[^[:space:]]' notes.md; then
                    echo "::error::В CHANGELOG.md нет раздела «## $version» или он пустой"
                    exit 1
                  fi
                  base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
                  setup="LeeLauncher-Setup-$version.exe"
                  dmg="LeeLauncher-$version-macos.dmg"
                  {
                    echo "### [⬇ Windows: $setup]($base/$setup)"
                    echo
                    echo "### [⬇ macOS: $dmg]($base/$dmg)"
                    echo
                    echo "или на сайте https://launcher.leeonttev.pro"
                    echo
                    echo "Download the installer above or at https://launcher.leeonttev.pro"
                    echo
                    cat notes.md
                  } > release-body.md

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: notes
                  path: |
                      notes.md
                      release-body.md

    windows:
        needs: prepare
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 12.11.2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

            - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: |
                      ./src-tauri -> target
                      ./installer -> target

            - run: pnpm install --frozen-lockfile

            # Лаунчер. Установщик NSIS Tauri собирается заодно, но в релиз не идёт.
            - name: Сборка лаунчера
              env:
                  # Вшивается в бинарник (`option_env!`); без него CurseForge в сборке выключен.
                  LEELAUNCHER_CURSEFORGE_KEY: ${{ secrets.LEELAUNCHER_CURSEFORGE_KEY }}
              run: pnpm tauri build

            - name: Загрузчик WebView2 от Microsoft
              shell: pwsh
              run: |
                  Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe
                  # Внутрь установщика попадает только файл с действующей подписью Microsoft.
                  $sig = Get-AuthenticodeSignature MicrosoftEdgeWebview2Setup.exe
                  if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
                    Write-Error "Подпись загрузчика WebView2 не прошла проверку: $($sig.Status) $($sig.SignerCertificate.Subject)"
                    exit 1
                  }

            # Свой установщик, лаунчер и загрузчик WebView2 внутри.
            - name: Сборка установщика
              shell: bash
              env:
                  LEELAUNCHER_PAYLOAD: ${{ github.workspace }}/src-tauri/target/release/LeeLauncher.exe
                  LEELAUNCHER_WEBVIEW2: ${{ github.workspace }}/MicrosoftEdgeWebview2Setup.exe
              run: |
                  cargo build --release --manifest-path installer/Cargo.toml
                  mkdir -p out
                  cp installer/target/release/LeeLauncher-Setup.exe "out/LeeLauncher-Setup-${GITHUB_REF_NAME#v}.exe"

            # Подпись minisign для автообновления (версия зашивается в подпись).
            - name: Подпись установщика
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  setup="out/LeeLauncher-Setup-$version.exe"
                  pnpm tauri signer sign --app-version "$version" "$setup"

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: windows
                  path: out/*
                  if-no-files-found: error

    macos:
        needs: prepare
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 12.11.2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: ./src-tauri -> target

            - run: pnpm install --frozen-lockfile

            # Один универсальный .app для Apple Silicon и Intel. Подпись ad-hoc (`signingIdentity: "-"`),
            # без Developer ID и нотаризации. `createUpdaterArtifacts` даёт архив `.app.tar.gz`
            # для обновления, его подпись `tauri build` делает этим же ключом.
            - name: Сборка лаунчера
              env:
                  LEELAUNCHER_CURSEFORGE_KEY: ${{ secrets.LEELAUNCHER_CURSEFORGE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: pnpm tauri build --target universal-apple-darwin

            # Подписываем ещё раз уже под именем релиза: версия зашивается в подпись явно.
            - name: Пакеты и подпись
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  bundle=src-tauri/target/universal-apple-darwin/release/bundle
                  mkdir -p out
                  dmgs=("$bundle"/dmg/*.dmg)
                  archives=("$bundle"/macos/*.app.tar.gz)
                  if [ "${#dmgs[@]}" -ne 1 ] || [ "${#archives[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ] || [ ! -f "${archives[0]}" ]; then
                    echo "::error::Не нашлись .dmg и .app.tar.gz: ${dmgs[*]} ${archives[*]}"
                    exit 1
                  fi
                  cp "${dmgs[0]}" "out/LeeLauncher-$version-macos.dmg"
                  cp "${archives[0]}" "out/LeeLauncher-$version-macos.app.tar.gz"
                  pnpm tauri signer sign --app-version "$version" "out/LeeLauncher-$version-macos.app.tar.gz"

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: macos
                  path: out/*
                  if-no-files-found: error

    publish:
        needs: [windows, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: out
                  merge-multiple: true

            # Универсальный архив macOS один на обе архитектуры.
            - name: latest.json
              shell: bash
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
                  setup="LeeLauncher-Setup-$version.exe"
                  archive="LeeLauncher-$version-macos.app.tar.gz"
                  node scripts/make-latest-json.mjs "$version" out/notes.md out/latest.json \
                    "windows-x86_64-nsis,windows-x86_64" "out/$setup" "$base/$setup" \
                    "darwin-aarch64-app,darwin-aarch64,darwin-x86_64-app,darwin-x86_64" "out/$archive" "$base/$archive"

            - name: Черновик релиза
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  gh release create "$GITHUB_REF_NAME" --draft --title "LeeLauncher $version" \
                    --notes-file out/release-body.md \
                    "out/LeeLauncher-Setup-$version.exe" \
                    "out/LeeLauncher-$version-macos.dmg" \
                    "out/LeeLauncher-$version-macos.app.tar.gz" \
                    "out/LeeLauncher-$version-macos.app.tar.gz.sig" \
                    out/latest.json
